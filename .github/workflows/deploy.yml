name: Deploy to Cloudflare Pages

# CF Pages' native git build fails on this repo with a platform-side "internal
# error" (before npm install runs). So we build in GitHub CI and upload the
# prebuilt dist via wrangler — same path as a manual `wrangler pages deploy`.
# Requires one repo secret: CLOUDFLARE_API_TOKEN (Pages: Edit permission).

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci
        env:
          # astro build does not need puppeteer's Chromium; skip the slow download
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dca78bc8b56786d9f0220866f4305c62
          command: pages deploy dist --project-name=tcm-ch --branch=main
