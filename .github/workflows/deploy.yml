name: Deploy to Cloudflare Worker (tcm-ch-2)

# CF's native git build fails on this repo with a platform-side "internal error"
# (before npm install runs). So we build in GitHub CI and ship the prebuilt
# dist/ + worker/ via wrangler — same path as a manual `wrangler deploy`.
# Target is the Worker project tcm-ch-2 (wrangler.jsonc); the old tcm-ch Pages
# project is dead and must not be deployed to.
# Requires one repo secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit).

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        env:
          # astro build does not need puppeteer's Chromium; skip the slow download
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: npm run build

      - name: Deploy Worker tcm-ch-2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dca78bc8b56786d9f0220866f4305c62
          command: deploy
