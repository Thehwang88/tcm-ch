name: Production safety gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: read

concurrency:
  group: production-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-safety:
    name: Production build & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build exact Cloudflare artifact
        run: npm run build
      - name: Immutable legacy template and deployment contracts
        run: node scripts/check-deployment-contracts.mjs
      - name: About-page patient conversion contract
        run: node scripts/check-about-cro.mjs
      - name: Bern clinic route contract
        run: node scripts/check-bern-live.mjs
      - name: Standort link and CTA regression gate
        run: node scripts/check-standort-ux.mjs
      - name: SG location-first structure and OneDoc regression contract
        run: node scripts/check-sg-location-first.mjs
      - name: SG compact therapy and complaint CRO contract
        run: node scripts/check-sg-compact-sections.mjs
      - name: All location SG-standard and uniform team roster
        run: node scripts/check-location-standard-rollout.mjs
      - name: SG knowledge guide SEO/booking contract
        run: node scripts/check-sg-knowledge-hub.mjs
      - name: German-English route integrity
        run: node scripts/check-i18n.mjs
      - name: Install Chromium for mocked browser tests
        run: |
          npx puppeteer browsers install chrome
          node --input-type=module -e "import p from 'puppeteer'; console.log('CHROMIUM='+await p.executablePath())" >> "$GITHUB_ENV"
      - name: SG Ersttermin default and explicit check-in (mock browser, no submissions)
        run: node scripts/test-sg-ersttermin-default.mjs
      - name: Mobile team swipe and visible next-card peek (Chromium)
        run: node scripts/test-location-team-swipe.mjs
      - name: English form analytics (mocked; no live conversions)
        run: node scripts/test-en-analytics.mjs

  # Legacy suites have known pre-existing failures (same as the last good
  # deployment). Publish diagnostics; never misrepresent them as green.
  # Require this job only after those suites have been repaired.
  legacy-regressions:
    name: Legacy regression inventory (informational)
    needs: production-safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for mocked browser tests
        run: |
          npx puppeteer browsers install chrome
          node --input-type=module -e "import p from 'puppeteer'; console.log('CHROMIUM='+await p.executablePath())" >> "$GITHUB_ENV"
      - name: Run and report outstanding regression suites
        run: node scripts/ci-legacy-audit.mjs
      - name: Upload full regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-regressions-${{ github.run_id }}
          path: ci-legacy-results/
          if-no-files-found: ignore
          retention-days: 14
